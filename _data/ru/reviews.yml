- name: Оляru
  position: Мама Василисы (3 года)
  text: "Хочу поделиться своим впечатлением от разбора, который сделал для меня и моей трёхлетней дочери Никита.

Сразу скажу – это было фантастически! До этого я пыталась разбираться в Human Design самостоятельно: читала статьи, смотрела информацию на сайтах, но всё было очень разрозненно, а главное – непонятно, как применять это в жизни.

Сессия с Никитой буквально всё разложила по полочкам. Всё время, пока мы разговаривали, у меня было ощущение, что он действительно говорит обо мне и о моей дочке, настолько точно и глубоко он разбирает каждую деталь.

Никита не просто объясняет, он помогает увидеть, понять и прожить все эти нюансы. Малейшие тонкости характера, особенности взаимодействия, скрытые механизмы — он высвечивает их и мягко направляет, давая реальные инструменты, как с этим работать в жизни.

Особенно ценным для меня стало понимание, как взаимодействовать с моим ребёнком. В конце разбора Никита прислал мне памятку с важными тезисами – ключевые моменты, на которые стоит обращать внимание в воспитании и общении. Это оказалось невероятно полезно, потому что теперь у меня есть не просто знания, а конкретные ориентиры, которые помогают лучше понимать и поддерживать моего ребёнка.

Это было не просто информативно – это было очень ценно и даже где-то терапевтично.

Если вы хотите действительно понять себя, своих близких, свои сильные и слабые стороны, если хотите увидеть, как ваш дизайн работает в жизни, то я однозначно рекомендую разбор у Никиты. Это тот случай, когда после сессии ты не просто получил информацию, а начинаешь видеть мир (и себя) по-другому"
  image: "/assets/images/people/olya.png"

- name: Женя
  position: Мама Емілії (3 роки)
  text: "Виховання дитини, взаємозв'язок з нею, правильний підхід, тощо - непрості задачі для батьків. Робити це все по інстинктам..? Не в наш час! Тому ми, як батьки, черпали інформацію з різних джерел. Натрапили на дизайн людини і вирішили спробувати. 

Нікіта нам в цьому допоміг, описав дизайн нашої доньки.
Деякі вже очевидні нам речі підтвердились, Нікіта лише трошки скорегував нас. Але надав багато нової інформації, з якою треба було працювати, правильно її використовувати. Насправді ця робота не проста.. але вона дає свої плоди.

Найперше, що нам вдалось, використовуючи дизайн нашої доньки - налагодити сон.. в її дизайні сон відіграє значну роль, тому ми стали підходити до цього питання по-іншому.. і це діє!

Наступне і досить важливе - ми навчились правильно ставити питання, пропонувати.. вести діалог в загальному з нашою донькою.. на цьому етапі стало легше доходити до 'спільного знаменника' і задовільняти потреби нашої доньки..

Працюємо над собою, щоб в потрібні моменти правильно сприймати і реагувати на емоції нашої доньки, на її поки що 'дитячі' невдачі.. і цьому всьому вчимо і її.. 

Ще багато чого треба навчитись бачити в дизайні нашої доньки.. вчити її правильно 'проживати себе'.. на це піде, напевно, багато часу.. але на даному етапі, в деяких моментах ми таки отримали певні результати.. і це заохочує..

Варто ще відзначити, що Нікіта описав дизайн нашої доньки в поєднанні з нашим дизайном, дизайном батьків.. так як ми різні по нашим типам, то і поради для кожного з нас були різні.. у нас батьків різна взаємодія з нашою дитиною.. тому кожен має працювати дещо з іншою 'методичкою'..

Так як отримали інформацію щодо особливостей наших дизайнів, то стали краще розуміти самі себе.. приймати себе і свого партнера.. напевно, це виявилось ще цікавіше - проаналізувати себе за свої 30років, порівняти з описом свого дизайну і усвідомити чи насправді ти 'проживав себе'.. і якщо в деяких випадках відповідь 'ні' - то як тобі виправити це і як вчиняти в майбутньому..

Ще раз щиро дякуємо Нікіті за допомогу!
Бажаємо йому успіхів, а  всім іншим бажаємо віднайти себе і жити в гармонії з самим собою!"
  image: "/assets/images/people/avatar.png"

- name: Аня
  position: Мама Лео (4 года)
  text: "Хочу поделиться своим опытом консультации с Никитой по Human Design для моего четырехлетнего сына. Честно говоря, я была немного скептически настроена, когда решилась на этот шаг, но теперь, после разбора, могу точно сказать, что это был один из самых полезных и значимых шагов в нашем воспитании.

На консультации Никита подробно разобрал особенности моего сына, его внутренние механизмы и склонности, а также объяснил, как я могу максимально поддерживать его в разных жизненных ситуациях. Это было не просто описание, а настоящая инструкция по взаимодействию с ребенком, основанная на его индивидуальных особенностях. Я начала по-новому смотреть на его реакции, на его эмоциональное состояние, на то, как правильно на них реагировать и что делать в моменты «непонимания».

Что мне особенно понравилось, так это то, как Никита объяснил, как мой сын воспринимает окружающий мир и что именно ему нужно, чтобы чувствовать себя уверенно и спокойно. Я получила конкретные рекомендации по улучшению его сна (кстати, это действительно помогло!) и по общению с ним в повседневных ситуациях.

После консультации я почувствовала, что у меня появился не просто набор знаний о ребенке, а четкое понимание, как быть с ним в различных ситуациях, как поддерживать его и развивать. Я увидела, как важно учитывать его внутреннюю природу, и теперь мне гораздо проще адаптировать наше общение."
  image: "/assets/images/people/avatar.png"
