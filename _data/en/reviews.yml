- name: Olga
  position: Mom of Vasilisa (3 y.o.)
  text: "I want to share my impression of the analysis that Nikita did for me and my three-year-old daughter.
I'll say right away – it was fantastic! Before this, I tried to understand Human Design on my own: read articles, looked at information on websites, but everything was very scattered, and most importantly – it wasn't clear how to apply it in life.
The session with Nikita literally put everything in order. The entire time we were talking, I had the feeling that he was really talking about me and my daughter, so accurately and deeply did he analyze every detail.
Nikita doesn't just explain, he helps you see, understand, and experience all these nuances. The slightest subtleties of character, interaction features, hidden mechanisms – he highlights them and gently guides, giving real tools on how to work with this in life.
Especially valuable for me was understanding how to interact with my child. At the end of the analysis, Nikita sent me a memo with important points – key things to pay attention to in upbringing and communication. This proved incredibly useful because now I have not just knowledge, but specific guidelines that help me better understand and support my child.
It wasn't just informative – it was very valuable and even somewhat therapeutic.
If you want to truly understand yourself, your loved ones, your strengths and weaknesses, if you want to see how your design works in life, then I definitely recommend analysis with Nikita. This is the case when after a session, you don't just receive information, but you begin to see the world (and yourself) differently."
  image: "/assets/images/people/olya.png"

- name: Jane
  position: Mom of Emily (3 y.o.)
  text: "Raising a child, connecting with them, finding the right approach, etc. - these are not easy tasks for parents. To do all this by instinct...? Not in our time! Therefore, we, as parents, drew information from various sources. We came across Human Design and decided to try it.
Nikita helped us with this, describing our daughter's design.
Some things that were already obvious to us were confirmed, Nikita only slightly corrected us. But he provided a lot of new information that we needed to work with, to use correctly. Indeed, this work is not easy... but it bears fruit.
The first thing we managed to do using our daughter's design was to improve her sleep... in her design, sleep plays a significant role, so we started approaching this issue differently... and it works!
The next and quite important thing - we learned how to ask questions correctly, make suggestions... conduct dialogue in general with our daughter... at this stage, it became easier to reach a 'common denominator' and satisfy our daughter's needs...
We're working on ourselves to properly perceive and react to our daughter's emotions at the right moments, to her still 'childish' failures... and we're teaching her all this too...
There's still much to learn to see in our daughter's design... teaching her to correctly 'live herself'... this will probably take a lot of time... but at this stage, in some aspects, we have already achieved certain results... and this is encouraging...
It's also worth noting that Nikita described our daughter's design in combination with our design, the parents' design... since we are different in our types, the advice for each of us was different... we parents have different interactions with our child... so each has to work with a somewhat different 'methodology'...
Since we received information about the peculiarities of our designs, we began to better understand ourselves... accept ourselves and our partner... probably, this turned out to be even more interesting - to analyze yourself over your 30 years, compare with the description of your design and realize whether you really 'lived yourself'... and if in some cases the answer is 'no' - then how to correct this and how to act in the future...
Once again, we sincerely thank Nikita for his help!
We wish him success, and we wish everyone else to find themselves and live in harmony with themselves!"
  image: "/assets/images/people/avatar.png"

- name: Anna
  position: Mom of Leo (4 y.o.)
  text: "I want to share my experience of consulting with Nikita on Human Design for my four-year-old son. Honestly, I was a bit skeptical when I decided to take this step, but now, after the analysis, I can definitely say that it was one of the most useful and significant steps in our parenting journey.
During the consultation, Nikita thoroughly analyzed my son's characteristics, his internal mechanisms and tendencies, and also explained how I can best support him in different life situations. This wasn't just a description, but a real instruction manual for interacting with a child, based on his individual characteristics. I began to see his reactions, his emotional state, how to properly respond to them, and what to do in moments of 'misunderstanding' in a new light.
What I especially liked was how Nikita explained how my son perceives the world around him and what exactly he needs to feel confident and calm. I received specific recommendations for improving his sleep (by the way, it really helped!) and for communicating with him in everyday situations.
After the consultation, I felt that I had gained not just a set of knowledge about my child, but a clear understanding of how to be with him in various situations, how to support and develop him. I saw how important it is to take into account his inner nature, and now it's much easier for me to adapt our communication."
  image: "/assets/images/people/avatar.png"
