- name: Іванка
  position: 
  text: "Нік, дуже дякую тобі за особистий розбір по HD і взагалі знайомство з сaмим HD через призму твоєї любові до нього♥️
Це знайомство дало мені остаточне підґрунтя глибше усвідомити, що всі люди різні. Дякую за це, насамперед🙏🏼
Це якісно покращило всю мою взаємодію з людьми, без перебільшень!

Я вже рік використовую знання про себе з особистого розбору і мала достатньо часу випробувати і дослідити чи вони працюють і як саме. Висновок - це завжди було, але воно було не легалізоване для мене, не зрозуміле, ззовні більше авторитету мало те «що правильно».

Ти допоміг надати цьому правильної, влучної для мого розуміння, словесної форми🤲🏻 Щиро тобі дякую.
Через цю «само-легалізацію», яка відбулась в результаті, я знайшла більше контакту з собою, перестала себе фіксити, відкинула «як треба» і в результаті краще зрозуміла і прийняла власну природу.
Дозволила собі бути )
І розслабилась у цьому, що добавило більше комфорту в моє життя і знизило рівень напруги й тривожності.
У ці буремні часи це мало особливий аспект важливості. Я рада, що звернулася до тебе за розбором."
  image: "/assets/images/people/iwanka.jpg"

- name: Эльнара
  position: 
  text: "Знакомство с Дизайном Человека меня впечатлило. Переслушивала запись нашей беседы несколько раз. Общение с тобой помогло принять себя такой, какая я есть. Раньше я пыталась прийти к себе через консультации с психологом, развить это в себе с других сторон. Но разгововр с тобой поставил в процессе жирную точку: хватит себя мучить, сосредоточься на том, что у тебя есть и рости в этом. А то, чего нет - имей это в виду и не пытайся слепить из себя кого-то, кем ты не являешься. На это ж уходит колоссальное количество энергии. И мне реально это помогло в том, что у меня нет явной идентичности. Я могу быть очень разной: сегодня такая, завтра - другая, а по жизни меня это очень напрягало, что я не могла найти фиксированную версию ответа на вопрос 'Кто Я', а сейчас я понимаю, что это моя фишка. Я слушаю запись нашей беседы как подкаст во время прогулки."
  image: "/assets/images/people/elnara.jpg"

- name: Аня Иванникова
  position: 
  text: "Консультация помогла мне лучше понять себя, свои триггеры и мотивацию к действию, свою ключевую ценность. Также стала лучше разбираться в моем взаимодействии с другими людьми и в эмоциональном фоне, который они мне приносят.

После консультации стала 
 ⁃ больше прислушиваться к тому, что откликается и пробовать что-то новое не из рациональных соображений, а из чувства внутреннего отклика;
 ⁃ меньше инициировать заранее цели и активности, а наблюдать что приходит; 
 ⁃ быть более вовлеченной в действительность и управлять своей энергией (заметила, когда я в конце дня не чувствую удовлетворения от деятельности за день и не расходую до конца энергию, то это негативно влияет на мой сон);
 ⁃ ставить приоритетом самоощущение жизни, а не цели и результаты;
 ⁃ лучше контролировать свое эмоциональное состояние: не ассоциировать себя с другими людьми и их чувствами, не воспринимать эмоции другого человека как свои, меньше беспокоиться о том, что не есть моими делами и не имеет значения для меня лично"
  image: "/assets/images/people/anya.jpg"

- name: Arezo
  position: 
  text: "The first time i heard about human design was through Nikita. He is passionate about it. His story of how he discovered and developed his information about it is interesting to me. Through his knowledge of human design I had the opportunity to learn more things about my self and think about life and ways of living from a different angle. Through the lense of HD, Nikita showed me there are more ways to interpret yourself and your personality. He makes it easy to accept who you are and be comfortable to deal with your self or on the other hand, change the things that are naturally bothering you but you are not aware of them. Thanks Nikita for such spirituality and such devotion."
