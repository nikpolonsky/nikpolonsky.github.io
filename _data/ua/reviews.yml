- name: Оля
  position: Мама Васіліси (3 роки)
  text: "Хочу поділитися своїми враженнями від розбору, який зробив для мене та моєї трирічної доньки Нікіта.

Скажу одразу — це було фантастично! До цього я намагалася самостійно розібратися в Human Design: читала статті, шукала інформацію на сайтах, але все здавалося розрізненим, а головне — незрозумілим у плані практичного застосування.

Сесія з Нікітою буквально розклала все по поличках. Увесь час, поки ми спілкувалися, я відчувала, що він справді говорить про мене і про мою доньку — настільки точно та глибоко він розбирає кожну деталь.

Нікіта не просто пояснює — він допомагає побачити, усвідомити й прожити всі ці нюанси. Найдрібніші риси характеру, особливості взаємодії, приховані механізми — він підсвічує їх і м’яко спрямовує, даючи реальні інструменти, як з цим жити й працювати.

Особливо цінним для мене стало розуміння, як взаємодіяти з моєю дитиною. Наприкінці розбору Нікіта надіслав мені пам’ятку з важливими тезами — ключовими моментами, на які варто звертати увагу у вихованні та спілкуванні. Це виявилося неймовірно корисним, бо тепер у мене є не просто знання, а конкретні орієнтири, які допомагають краще розуміти й підтримувати мою дитину.

Це було не просто інформативно — це було дуже цінно і навіть певною мірою терапевтично.

Якщо ви справді хочете краще зрозуміти себе, своїх близьких, свої сильні та вразливі сторони, якщо хочете побачити, як ваш дизайн працює у житті — я однозначно рекомендую розбір у Нікіти. Це саме той випадок, коли після сесії ти не просто отримуєш інформацію, а починаєш інакше бачити світ (і себе)."
  image: "/assets/images/people/olya.png"

- name: Женя
  position: Мама Емілії (3 роки)
  text: "Виховання дитини, взаємозв'язок з нею, правильний підхід, тощо - непрості задачі для батьків. Робити це все по інстинктам..? Не в наш час! Тому ми, як батьки, черпали інформацію з різних джерел. Натрапили на дизайн людини і вирішили спробувати. 

Нікіта нам в цьому допоміг, описав дизайн нашої доньки.
Деякі вже очевидні нам речі підтвердились, Нікіта лише трошки скорегував нас. Але надав багато нової інформації, з якою треба було працювати, правильно її використовувати. Насправді ця робота не проста.. але вона дає свої плоди.

Найперше, що нам вдалось, використовуючи дизайн нашої доньки - налагодити сон.. в її дизайні сон відіграє значну роль, тому ми стали підходити до цього питання по-іншому.. і це діє!

Наступне і досить важливе - ми навчились правильно ставити питання, пропонувати.. вести діалог в загальному з нашою донькою.. на цьому етапі стало легше доходити до 'спільного знаменника' і задовільняти потреби нашої доньки..

Працюємо над собою, щоб в потрібні моменти правильно сприймати і реагувати на емоції нашої доньки, на її поки що 'дитячі' невдачі.. і цьому всьому вчимо і її.. 

Ще багато чого треба навчитись бачити в дизайні нашої доньки.. вчити її правильно 'проживати себе'.. на це піде, напевно, багато часу.. але на даному етапі, в деяких моментах ми таки отримали певні результати.. і це заохочує..

Варто ще відзначити, що Нікіта описав дизайн нашої доньки в поєднанні з нашим дизайном, дизайном батьків.. так як ми різні по нашим типам, то і поради для кожного з нас були різні.. у нас батьків різна взаємодія з нашою дитиною.. тому кожен має працювати дещо з іншою 'методичкою'..

Так як отримали інформацію щодо особливостей наших дизайнів, то стали краще розуміти самі себе.. приймати себе і свого партнера.. напевно, це виявилось ще цікавіше - проаналізувати себе за свої 30років, порівняти з описом свого дизайну і усвідомити чи насправді ти 'проживав себе'.. і якщо в деяких випадках відповідь 'ні' - то як тобі виправити це і як вчиняти в майбутньому..

Ще раз щиро дякуємо Нікіті за допомогу!
Бажаємо йому успіхів, а  всім іншим бажаємо віднайти себе і жити в гармонії з самим собою!"
  image: "/assets/images/people/avatar.png"

- name: Аня
  position: Мама Лео (4 роки)
  text: "Хочу поділитися своїм досвідом консультації з Нікітою щодо Human Design для мого чотирирічного сина. Якщо чесно, спочатку я була трохи скептично налаштована, коли вирішила зробити цей крок, але зараз, після розбору, можу точно сказати — це був один із найкорисніших і найважливіших кроків у нашому вихованні.

Під час консультації Нікіта детально розібрав особливості мого сина, його внутрішні механізми й схильності, а також пояснив, як я можу максимально його підтримувати в різних життєвих ситуаціях. Це було не просто описання, а справжня інструкція щодо взаємодії з дитиною, заснована на її індивідуальних особливостях. Я почала по-новому дивитися на його реакції, на емоційний стан, на те, як правильно реагувати і що робити в моменти «нерозуміння».

Що мені особливо сподобалося — це те, як Нікіта пояснив, як мій син сприймає навколишній світ і що саме йому потрібно, аби почуватися впевнено й спокійно. Я отримала конкретні рекомендації щодо покращення його сну (до речі, це справді спрацювало!) та щодо спілкування з ним у повсякденних ситуаціях.

Після консультації я відчула, що маю не просто набір знань про дитину, а чітке розуміння того, як бути з нею в різних ситуаціях, як підтримувати й розвивати. Я побачила, наскільки важливо враховувати її внутрішню природу — і тепер мені значно легше адаптувати наше спілкування."
  image: "/assets/images/people/avatar.png"
