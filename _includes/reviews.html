<div class="reviews-container">
  <div class="reviews-wrapper" id="reviewsWrapper">
    <div class="review">
      <img src="/assets/avatar1.jpg" alt="Client 1" class="avatar">
      <h4>John Doe</h4>
      <p>"This service is amazing! Highly recommended."</p>
    </div>
    <div class="review">
      <img src="/assets/avatar2.jpg" alt="Client 2" class="avatar">
      <h4>Jane Smith</h4>
      <p>"A game-changer for my business! Love it."</p>
    </div>
    <div class="review">
      <img src="/assets/avatar3.jpg" alt="Client 3" class="avatar">
      <h4>Mike Johnson</h4>
      <p>"Fantastic customer support and easy to use."</p>
    </div>
  </div>

  <!-- Pagination Dots -->
  <div class="pagination" id="pagination"></div>
</div>

<style>
  .reviews-container {
    position: relative;
    overflow: hidden;
    width: 100%;
    max-width: 600px; /* Adjust width as needed */
    margin: auto;
  }

  .reviews-wrapper {
    display: flex;
    scroll-snap-type: x mandatory;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    white-space: nowrap;
  }

  .review {
    flex: 0 0 100%;
    width: 100%;
    background: #f8f8f8;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    scroll-snap-align: center;
  }

  .avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    margin-bottom: 10px;
  }

  /* Pagination Dots */
  .pagination {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }

  .dot {
    width: 10px;
    height: 10px;
    margin: 0 5px;
    background: #ccc;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .dot.active {
    background: #333;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const wrapper = document.getElementById("reviewsWrapper");
    const pagination = document.getElementById("pagination");
    const reviews = document.querySelectorAll(".review");
    let currentIndex = 0;

    // Create pagination dots
    reviews.forEach((_, index) => {
      const dot = document.createElement("div");
      dot.classList.add("dot");
      if (index === 0) dot.classList.add("active");
      dot.addEventListener("click", () => scrollToReview(index));
      pagination.appendChild(dot);
    });

    function scrollToReview(index) {
      const offset = index * wrapper.clientWidth;
      wrapper.scrollTo({ left: offset, behavior: "smooth" });
      updateDots(index);
    }

    function updateDots(index) {
      document.querySelectorAll(".dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
      });
      currentIndex = index;
    }

    // Detect scroll position and update dots
    wrapper.addEventListener("scroll", () => {
      let newIndex = Math.round(wrapper.scrollLeft / wrapper.clientWidth);
      if (newIndex !== currentIndex) {
        updateDots(newIndex);
      }
    });
  });
</script>
