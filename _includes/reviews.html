<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews Slider</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .reviews-container {
            position: relative;
            width: 80%;
            max-width: 600px;
            overflow: hidden;
            padding: 20px;
        }

        .reviews-wrapper {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* Hide scrollbar for Firefox */
        }

        .reviews-wrapper::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome, Safari */
        }

        .review {
            flex: 0 0 auto;
            width: 100%;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            scroll-snap-align: center;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .dot {
            width: 10px;
            height: 10px;
            margin: 0 5px;
            background: #bbb;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dot.active {
            background: #333;
        }

        .nav-buttons {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }

        .prev, .next {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 18px;
        }

        .prev:hover, .next:hover {
            background: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="reviews-container">
        <div class="nav-buttons">
            <button class="prev">←</button>
            <button class="next">→</button>
        </div>

        <div class="reviews-wrapper">
            <div class="review">
                <img src="/assets/avatar1.jpg" alt="Client 1" class="avatar">
                <h4>John Doe</h4>
                <p>"This service is amazing! Highly recommended."</p>
            </div>
            <div class="review">
                <img src="/assets/avatar2.jpg" alt="Client 2" class="avatar">
                <h4>Jane Smith</h4>
                <p>"A game-changer for my business! Love it."</p>
            </div>
            <div class="review">
                <img src="/assets/avatar3.jpg" alt="Client 3" class="avatar">
                <h4>Mike Johnson</h4>
                <p>"Fantastic customer support and easy to use."</p>
            </div>
        </div>

        <div class="pagination">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <script>
        const wrapper = document.querySelector(".reviews-wrapper");
        const reviews = document.querySelectorAll(".review");
        const dots = document.querySelectorAll(".dot");
        const prevBtn = document.querySelector(".prev");
        const nextBtn = document.querySelector(".next");

        let reviewWidth = reviews[0].offsetWidth;

        function updateActiveDot(index) {
            dots.forEach(dot => dot.classList.remove("active"));
            dots[index].classList.add("active");
        }

        dots.forEach((dot, index) => {
            dot.addEventListener("click", () => {
                wrapper.scrollTo({ left: index * reviewWidth, behavior: "smooth" });
                updateActiveDot(index);
            });
        });

        nextBtn.addEventListener("click", () => {
            let newIndex = Math.min(Math.floor(wrapper.scrollLeft / reviewWidth) + 1, reviews.length - 1);
            wrapper.scrollTo({ left: newIndex * reviewWidth, behavior: "smooth" });
            updateActiveDot(newIndex);
        });

        prevBtn.addEventListener("click", () => {
            let newIndex = Math.max(Math.floor(wrapper.scrollLeft / reviewWidth) - 1, 0);
            wrapper.scrollTo({ left: newIndex * reviewWidth, behavior: "smooth" });
            updateActiveDot(newIndex);
        });

        wrapper.addEventListener("scroll", () => {
            let index = Math.round(wrapper.scrollLeft / reviewWidth);
            updateActiveDot(index);
        });

        window.addEventListener("resize", () => {
            reviewWidth = reviews[0].offsetWidth;
        });
    </script>

</body>
</html>
