<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews Block</title>
  <style>
    /* Reviews Block Container */
    .reviews-container {
      max-width: 100%;
      margin-bottom: 20px;
      position: relative;
    }

    /* Reviews Wrapper */
    .reviews-wrapper {
      position: relative;
      overflow: hidden;
      touch-action: pan-y pinch-zoom;
    }

    /* Reviews Track */
    .reviews-track {
      display: flex;
      transition: transform 0.3s ease;
      will-change: transform;
    }

    /* Individual Review */
    .review-card {
      flex: 0 0 100%;
      max-width: 100%;
      box-sizing: border-box;
      scroll-snap-align: start;
    }

    .review-inner {
      background: #ffffff;
      border-radius: 8px;
      padding: 25px;
/*      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);*/
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .review-text {
      line-height: 1.6;
      flex-grow: 1;
      margin-bottom: 20px;
    }

    .review-author {
      display: flex;
      align-items: center;
      margin-top: auto;
    }

    .author-image {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      margin-right: 15px;
      background-color: #e9e9e9;
    }

    .author-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .author-info h4 {
      margin: 0 0 5px 0;
      font-weight: 600;
    }

    .author-info p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    /* Pagination Dots */
    .reviews-dots {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      margin: 0 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .dot.active {
      background: #333;
    }

    /* Mobile Swipe Indicators */
    .swipe-indicator {
      display: none;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px;
      border-radius: 4px;
      z-index: 10;
      animation: fadeOut 2s forwards;
      animation-delay: 5s;
    }

    .swipe-indicator.left {
      left: 20px;
    }

    .swipe-indicator.right {
      right: 20px;
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    @media (max-width: 768px) {
      .swipe-indicator {
        display: block;
      }
    }
  </style>
</head>
<body>

{% comment %} This is the Jekyll Reviews Block {% endcomment %}
<div class="reviews-container">  
  <div class="reviews-wrapper">
    <div class="reviews-track">
      {% for review in site.data.reviews %}
      <div class="review-card">
        <div class="review-inner">
          <div class="review-text">
            {{ review.text }}
          </div>
          <div class="review-author">
            <div class="author-image">
              {% if review.image %}
              <img src="{{ review.image }}" alt="{{ review.name }}">
              {% endif %}
            </div>
            <div class="author-info">
              <h4>{{ review.name }}</h4>
              <p>{{ review.position }}</p>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
  
  <div class="reviews-dots"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const track = document.querySelector('.reviews-track');
    const slides = Array.from(track.children);
    const container = document.querySelector('.reviews-wrapper');
    const dotsContainer = document.querySelector('.reviews-dots');
    
    let currentIndex = 0;
    let startX, startY, startTime;
    let isDragging = false;
    let startTranslate = 0;
    let currentTranslate = 0;
    let prevTranslate = 0;
    
    // Scroll control variables
    let lastScrollTime = 0;
    let scrollTimeout = null;
    const scrollCooldown = 500; // ms to wait between scroll actions
    let wheelDeltaTotal = 0;
    const wheelThreshold = 50; // Amount of wheel delta needed to trigger a slide change
    
    // Initialize
    function initialize() {
      // Create pagination dots
      for (let i = 0; i < slides.length; i++) {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        if (i === 0) dot.classList.add('active');
        dot.addEventListener('click', () => {
          goToSlide(i);
        });
        dotsContainer.appendChild(dot);
      }
      
      // Update slide widths
      updateSlideWidth();
      
      // Add swipe indicators for mobile users
      if (window.innerWidth <= 768 && slides.length > 1) {
        addSwipeIndicators();
      }
    }
    
    function addSwipeIndicators() {
      const container = document.querySelector('.reviews-container');
      
      // Only add if we have more than one slide
      if (slides.length <= 1) return;
      
      // Create swipe indicators
      const rightIndicator = document.createElement('div');
      rightIndicator.classList.add('swipe-indicator', 'right');
      rightIndicator.textContent = '← Swipe';
      
      const leftIndicator = document.createElement('div');
      leftIndicator.classList.add('swipe-indicator', 'left');
      leftIndicator.textContent = 'Swipe →';
      
      container.appendChild(rightIndicator);
      container.appendChild(leftIndicator);
    }
    
    // Update slide width based on container width
    function updateSlideWidth() {
      slides.forEach(slide => {
        slide.style.flex = `0 0 100%`;
        slide.style.maxWidth = `100%`;
      });
      
      // Update position to reflect new widths
      updateTrackPosition();
    }
    
    // Update the active dot
    function updateDots() {
      const dots = Array.from(dotsContainer.children);
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', currentIndex === i);
      });
    }
    
    // Go to specific slide
    function goToSlide(index) {
      currentIndex = Math.max(0, Math.min(index, slides.length - 1));
      updateTrackPosition();
      updateDots();
    }
    
    // Update the track position based on currentIndex
    function updateTrackPosition() {
      currentTranslate = currentIndex * -100;
      prevTranslate = currentTranslate;
      setTrackPosition(currentTranslate);
    }
    
    // Set the track position with transform
    function setTrackPosition(position) {
      track.style.transform = `translateX(${position}%)`;
    }
    
    // Improved wheel handling for smoother, more controlled scrolling
    container.addEventListener('wheel', function(e) {
      e.preventDefault();
      
      const now = Date.now();
      
      // Different handling for trackpad vs mouse wheel
      if (e.deltaMode === 0) {
        // Trackpad (pixel-based scrolling)
        handleTrackpadScroll(e);
      } else {
        // Mouse wheel (line or page based scrolling)
        handleMouseWheelScroll(e);
      }
    }, { passive: false });
    
    function handleTrackpadScroll(e) {
      // Accumulate scroll delta
      wheelDeltaTotal += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      
      // Clear any existing timeout
      if (scrollTimeout) {
        clearTimeout(scrollTimeout);
      }
      
      // Set a timeout to reset the accumulated delta if scrolling stops
      scrollTimeout = setTimeout(() => {
        wheelDeltaTotal = 0;
      }, 200);
      
      // Only trigger a slide change when threshold is reached
      if (Math.abs(wheelDeltaTotal) >= wheelThreshold) {
        const now = Date.now();
        
        // Add cooldown to prevent rapid scrolling
        if (now - lastScrollTime > scrollCooldown) {
          const scrollDirection = wheelDeltaTotal > 0 ? 1 : -1;
          goToSlide(currentIndex + scrollDirection);
          lastScrollTime = now;
        }
        
        // Reset accumulator after processing
        wheelDeltaTotal = 0;
      }
    }
    
    function handleMouseWheelScroll(e) {
      const now = Date.now();
      
      // Add cooldown to prevent rapid scrolling
      if (now - lastScrollTime > 300) {
        const scrollAmount = (e.deltaY > 0 || e.deltaX > 0) ? 1 : -1;
        goToSlide(currentIndex + scrollAmount);
        lastScrollTime = now;
      }
    }
    
    // Mobile touch events
    container.addEventListener('touchstart', touchStart);
    container.addEventListener('touchmove', touchMove);
    container.addEventListener('touchend', touchEnd);
    
    function touchStart(event) {
      startTime = new Date().getTime();
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
      isDragging = true;
      startTranslate = currentTranslate;
      
      // Disable transition during drag
      track.style.transition = 'none';
    }
    
    function touchMove(event) {
      if (!isDragging) return;
      
      const currentX = event.touches[0].clientX;
      const currentY = event.touches[0].clientY;
      
      // Calculate horizontal and vertical distance
      const diffX = currentX - startX;
      const diffY = currentY - startY;
      
      // If vertical scrolling is dominant, don't interfere
      if (Math.abs(diffY) > Math.abs(diffX)) {
        return;
      }
      
      // Prevent default to stop page scrolling
      event.preventDefault();
      
      const containerWidth = container.offsetWidth;
      const percentMove = (diffX / containerWidth) * 100;
      currentTranslate = startTranslate + percentMove;
      
      // Add resistance at edges
      if (currentIndex === 0 && currentTranslate > 0) {
        currentTranslate = currentTranslate * 0.3;
      }
      
      if (currentIndex === slides.length - 1 && currentTranslate < startTranslate) {
        currentTranslate = startTranslate + (currentTranslate - startTranslate) * 0.3;
      }
      
      setTrackPosition(currentTranslate);
    }
    
    function touchEnd(event) {
      if (!isDragging) return;
      isDragging = false;
      
      // Enable transition again
      track.style.transition = 'transform 0.3s ease';
      
      const touchEndTime = new Date().getTime();
      const touchTime = touchEndTime - startTime;
      
      const currentX = event.changedTouches[0].clientX;
      const diffX = currentX - startX;
      const containerWidth = container.offsetWidth;
      
      // If swipe is fast enough, go to next/prev regardless of distance
      if (touchTime < 300 && Math.abs(diffX) > containerWidth * 0.1) {
        if (diffX > 0) {
          goToSlide(currentIndex - 1);
        } else {
          goToSlide(currentIndex + 1);
        }
        return;
      }
      
      // If swipe distance is significant enough
      if (Math.abs(diffX) > containerWidth * 0.25) {
        if (diffX > 0) {
          goToSlide(currentIndex - 1);
        } else {
          goToSlide(currentIndex + 1);
        }
      } else {
        // Snap back to current slide
        goToSlide(currentIndex);
      }
    }
    
    // Handle window resize
    window.addEventListener('resize', function() {
      updateSlideWidth();
    });
    
    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        goToSlide(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        goToSlide(currentIndex + 1);
      }
    });
    
    // Initialize the carousel
    initialize();
  });
</script>

</body>
</html>
