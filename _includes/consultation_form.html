<div class="consultation-form-container">
  <form id="consultation-form">
    <h2>{{ include.form.title }}</h2>

    <div class="form-group">
      <input type="text" id="name" name="name" required placeholder="{{ include.form.name_placeholder }}">
    </div>
    <div class="form-group">
      <input type="text" id="contact" name="contact" required placeholder="{{ include.form.contact_placeholder }}">
    </div>
    <div class="form-group">
      <input type="text" id="social" name="social" required placeholder="{{ include.form.social_placeholder }}">
    </div>
    <div class="form-note">
      <p>{{ include.form.privacy_note }}</p>
    </div>
    <div class="button-container">
      <button type="submit" class="button">{{ include.form.submit }}</button>
    </div>
    <div class="form-message">
      <p>{{ include.form.confirmation }}</p>
    </div>
  </form>
</div>
